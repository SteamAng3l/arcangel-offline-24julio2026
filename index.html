<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcángel – Guía y Mensajero de la Palabra</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <style>
        :root {
            --dorado: #d4af37;
            --purpura-oscuro: #2e1a2b;
            --crema: #f5e9d8;
            --bg-body: #1a0f0f;
            --bg-panel: rgba(46, 26, 43, 0.7);
            --text-color: #f5e9d8;
            --text-secondary: #e0d3b8;
            --button-bg: rgba(212, 175, 55, 0.2);
            --button-border: rgba(212, 175, 55, 0.6);
            --resp-bg: rgba(20, 10, 5, 0.8);
            --resp-text: #f5e9d8;
            --resp-cita: #d4af37;
            --resp-empatica: #e0d3b8;
        }

        body.modo-claro {
            --bg-body: #fdfaf3;
            --bg-panel: rgba(255, 250, 240, 0.85);
            --text-color: #3e2c1f;
            --text-secondary: #5a4a3a;
            --button-bg: rgba(212, 175, 55, 0.3);
            --button-border: rgba(180, 130, 20, 0.6);
            --crema: #3e2c1f;
            --resp-bg: rgba(20, 10, 5, 0.85);
            --resp-text: #f5e9d8;
            --resp-cita: #d4af37;
            --resp-empatica: #e0d3b8;
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'Cinzel', 'Times New Roman', serif;
            background: var(--bg-body) url('assets/fondo-pared.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px 10px 90px 10px;
            position: relative;
            transition: background-color 0.3s, color 0.3s;
        }

        body::before {
            content: '';
            position: fixed; top:0; left:0;
            width:100%; height:100%;
            background-color: rgba(0,0,0,0.4);
            z-index:-1;
        }
        body.modo-claro::before {
            background-color: rgba(255,255,240,0.3);
        }

        .app-container { width:100%; max-width:500px; margin:0 auto; }

        .panel {
            background: var(--bg-panel);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 1.8rem 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            margin-bottom: 15px;
            border: 1px solid rgba(212,175,55,0.3);
        }

        h1 { font-size:2.4rem; margin-bottom:0.2rem; color:var(--dorado); letter-spacing:3px; }
        .subtitulo { font-size:1rem; color:var(--text-secondary); margin-bottom:1.5rem; font-style:italic; }
        .frase-corazon { font-size:1.3rem; margin-bottom:1.2rem; font-weight:bold; }

        textarea {
            width:100%; height:80px; padding:0.8rem;
            border:1px solid rgba(212,175,55,0.5); border-radius:12px;
            background: rgba(255,255,255,0.1); color:var(--text-color);
            font-family:inherit; font-size:1rem; resize:none; outline:none;
            margin-bottom:0.8rem;
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
        }
        textarea::placeholder { color: #cbbfa5; }

        .botonera {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            align-items: center;
            margin-bottom: 0.8rem;
        }
        .botonera > button {
            width: 100%;
            justify-content: center;
        }
        @media (min-width: 360px) {
            .botonera {
                flex-direction: row;
                flex-wrap: wrap;
            }
            .botonera > button {
                width: auto;
                flex: 1;
            }
        }

        button {
            background: var(--button-bg);
            border:1px solid var(--button-border);
            color: var(--text-color);
            padding:0.6rem 1.2rem; border-radius:30px;
            font-family:inherit; font-size:0.95rem; cursor:pointer;
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            transition: background 0.3s, transform 0.2s;
            display:inline-flex; align-items:center; gap:0.4rem;
        }
        button:hover { background: rgba(212,175,55,0.4); transform:scale(1.02); }
        button.microfono { background: rgba(200,100,100,0.35); border-color: rgba(200,100,100,0.7); }

        /* ===== CUADRO DE RESPUESTA UNIFICADO ===== */
        .respuesta {
            background: var(--resp-bg);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-radius:15px; padding:1.2rem; margin-top:1rem; text-align:left;
            color: var(--resp-text);
        }
        .respuesta .categoria-nombre {
            font-size:0.85rem; color:var(--resp-cita); margin-bottom:0.3rem; font-weight:bold;
        }
        .respuesta .frase-empatica {
            font-style:italic; color:var(--resp-empatica); margin-bottom:0.6rem;
        }
        .respuesta .versiculo-texto {
            font-size:1.15rem; margin-bottom:0.4rem; line-height:1.6;
        }
        .respuesta .versiculo-cita {
            font-weight:bold; color:var(--resp-cita); margin-bottom:0.6rem;
        }
        .acciones-versiculo {
            display:flex; gap:0.6rem; flex-wrap:wrap; margin-top:0.5rem;
        }
        .acciones-versiculo button {
            font-size:0.9rem; padding:0.4rem 1rem;
            background:rgba(255,255,255,0.15); border-color:rgba(255,255,255,0.3);
            color: var(--resp-text);
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.7); display:none;
            justify-content:center; align-items:center; z-index:300;
        }
        .modal-overlay.activo { display:flex; }
        .modal-contenido {
            background: var(--bg-panel);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-radius:20px; padding:1.5rem;
            max-width:90%; width:400px;
            border:1px solid var(--dorado);
            text-align:left;
            position: relative;
        }
        .modal-contenido .cerrar-modal {
            position:absolute; top:10px; right:15px; background:transparent; border:none;
            color:var(--dorado); font-size:1.5rem; cursor:pointer;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            position:fixed; bottom:0; left:0; width:100%;
            background:rgba(30,10,20,0.85); backdrop-filter:blur(15px);
            -webkit-backdrop-filter:blur(15px);
            display:flex; justify-content:space-around; align-items:center;
            padding:0.7rem 0; border-top:1px solid rgba(212,175,55,0.5); z-index:100;
        }
        .navbar button {
            background:transparent; border:none; color:#cbbfa5;
            font-size:0.9rem; flex-direction:column; gap:0.2rem;
            padding:0.3rem 0.8rem; border-radius:12px;
            display:flex; align-items:center;
        }
        .navbar button.activo { color:var(--dorado); background:rgba(212,175,55,0.2); }
        .navbar button .material-icons-outlined { font-size:1.4rem; }

        .pagina { display:none; }
        .pagina.activa { display:block; }

        .categorias-grid {
            display:grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap:0.5rem;
            justify-items: stretch;
            margin-top:1rem;
        }
        .categoria-btn {
            background:var(--button-bg); border:1px solid var(--button-border);
            color:var(--text-color); padding:0.5rem; border-radius:15px;
            font-size:0.85rem; cursor:pointer; transition:background 0.3s;
            text-align:center;
        }
        .categoria-btn:hover { background:rgba(212,175,55,0.35); }

        /* Favoritos */
        .favorito-item {
            background: var(--resp-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius:12px;
            padding:0.8rem; margin-bottom:0.6rem; text-align:left; position:relative;
            color: var(--resp-text);
        }
        .favorito-item .categoria-nombre {
            font-size:0.85rem; color:var(--resp-cita); margin-bottom:0.3rem; font-weight:bold;
        }
        .favorito-item .frase-empatica {
            font-style:italic; color:var(--resp-empatica); margin-bottom:0.6rem;
        }
        .favorito-item .versiculo-texto {
            font-size:1.15rem; margin-bottom:0.4rem; line-height:1.6;
        }
        .favorito-item .versiculo-cita {
            font-weight:bold; color:var(--resp-cita); margin-bottom:0.6rem;
        }
        .favorito-item .acciones-versiculo button {
            font-size:0.8rem; padding:0.3rem 0.7rem;
            background:rgba(255,255,255,0.15); border-color:rgba(255,255,255,0.3);
            color: var(--resp-text);
        }
        .eliminar-fav {
            position:absolute; top:5px; right:10px; background:transparent;
            border:none; color:#e0d3b8; font-size:1.2rem; cursor:pointer;
        }
        .no-favoritos { font-style:italic; color:#cbbfa5; margin-top:1.5rem; }

        .modo-toggle {
            position:fixed; top:15px; right:20px; font-size:1.5rem; cursor:pointer; z-index:200;
        }

        #canvasCompartir { display:none; }
    </style>
</head>
<body>

    <div class="modo-toggle" onclick="toggleModo()">🌙</div>

    <div class="app-container">

        <!-- INICIO -->
        <div id="paginaInicio" class="pagina activa">
            <div class="panel">
                <h1>Arcángel</h1>
                <p class="subtitulo">Guía y Mensajero de la Palabra</p>
                <p class="frase-corazon">¿Qué hay en tu corazón hoy?</p>
                <textarea id="inputSentimiento" placeholder="Escribe cómo te sientes, tus preocupaciones o tus miedos..."></textarea>
                <div class="botonera">
                    <button class="microfono" id="botonHablar"
                            onmousedown="iniciarDictado()" onmouseup="detenerDictado()"
                            ontouchstart="iniciarDictado()" ontouchend="detenerDictado()">
                        <span class="material-icons-outlined">mic</span> Háblame
                    </button>
                    <button onclick="buscarVersiculo()">
                        <span class="material-icons-outlined">search</span> Buscar versículo
                    </button>
                    <button onclick="versiculoAleatorio()">
                        <svg width="1.4em" height="1.4em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 4v12M6 9h12"/>
                        </svg>
                        Versículo aleatorio
                    </button>
                </div>
                <div id="respuestaBox" class="respuesta" style="display:none;">
                    <div class="categoria-nombre" id="categoriaNombreInicio"></div>
                    <div class="frase-empatica" id="fraseEmpatica"></div>
                    <div class="versiculo-texto" id="textoVersiculo"></div>
                    <div class="versiculo-cita" id="citaVersiculo"></div>
                    <div class="acciones-versiculo">
                        <button onclick="speakVersiculo()"><span class="material-icons-outlined">volume_up</span> Escuchar</button>
                        <button onclick="guardarFavorito()"><span class="material-icons-outlined">star</span> Guardar</button>
                        <button onclick="compartirImagen()"><span class="material-icons-outlined">share</span> Compartir</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- CATEGORÍAS -->
        <div id="paginaCategorias" class="pagina">
            <div class="panel">
                <h2 style="color:var(--dorado); margin-bottom:1rem;">Categorías</h2>
                <div class="categorias-grid" id="categoriasContainer"></div>
            </div>
        </div>

        <!-- MODAL -->
        <div class="modal-overlay" id="modalCategoria">
            <div class="modal-contenido">
                <button class="cerrar-modal" onclick="cerrarModal()">&times;</button>
                <div class="respuesta" id="respuestaModal">
                    <div class="categoria-nombre" id="categoriaNombreModal"></div>
                    <div class="frase-empatica" id="fraseEmpaticaModal"></div>
                    <div class="versiculo-texto" id="textoVersiculoModal"></div>
                    <div class="versiculo-cita" id="citaVersiculoModal"></div>
                    <div class="acciones-versiculo">
                        <button onclick="speakVersiculoModal()"><span class="material-icons-outlined">volume_up</span> Escuchar</button>
                        <button onclick="nuevoVersiculoCategoria()"><span class="material-icons-outlined">refresh</span> Nuevo</button>
                        <button onclick="guardarFavoritoDesdeModal()"><span class="material-icons-outlined">star</span> Guardar</button>
                        <button onclick="compartirDesdeModal()"><span class="material-icons-outlined">share</span> Compartir</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- FAVORITOS -->
        <div id="paginaFavoritos" class="pagina">
            <div class="panel">
                <h2 style="color:var(--dorado); margin-bottom:1rem;">Mis Favoritos</h2>
                <div id="listaFavoritos"></div>
                <div class="no-favoritos" id="noFavoritosMsg">No tienes versículos guardados aún.</div>
            </div>
        </div>

    </div>

    <!-- NAVBAR -->
    <div class="navbar">
        <button id="navInicio" class="activo" onclick="cambiarPagina('inicio')">
            <span class="material-icons-outlined">home</span> <span>Inicio</span>
        </button>
        <button id="navCategorias" onclick="cambiarPagina('categorias')">
            <span class="material-icons-outlined">apps</span> <span>Categorías</span>
        </button>
        <button id="navFavoritos" onclick="cambiarPagina('favoritos')">
            <span class="material-icons-outlined">star</span> <span>Favoritos</span>
        </button>
    </div>

    <canvas id="canvasCompartir" width="800" height="800"></canvas>

    <script src="bible.js"></script>
    <script src="categories.js"></script>
    <script>
        // ===== FUNCIONES AUXILIARES =====
        function normalizarTexto(str) {
            return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        }

        function obtenerTextoVersiculo(referencia) {
            if (typeof bibleData === 'undefined') return 'Error: Biblia no cargada.';
            
            const refLibro = normalizarTexto(referencia.libro);
            const refCap = referencia.capitulo.toString();
            const refVer = referencia.versiculo.toString();

            for (const testamento in bibleData) {
                const resultado = buscarEnLibros(bibleData[testamento], refLibro, refCap, refVer);
                if (resultado) return resultado;
            }

            // Variaciones: probar sin plural y con plural
            const variantes = [];
            if (refLibro.endsWith('s')) variantes.push(refLibro.slice(0, -1));
            else variantes.push(refLibro + 's');
            variantes.push(refLibro.charAt(0).toUpperCase() + refLibro.slice(1));

            for (const testamento in bibleData) {
                for (const variante of variantes) {
                    const resultado = buscarEnLibros(bibleData[testamento], variante, refCap, refVer);
                    if (resultado) return resultado;
                }
            }

            console.warn(`❌ Libro no encontrado: ${referencia.libro}`);
            return `[Libro no encontrado: ${referencia.libro}]`;
        }

        function buscarEnLibros(libros, nombreLibro, capitulo, versiculo) {
            const nombreNormalizado = normalizarTexto(nombreLibro);
            for (const clave in libros) {
                if (normalizarTexto(clave) === nombreNormalizado) {
                    const cap = libros[clave][capitulo];
                    if (cap && cap[versiculo]) {
                        return cap[versiculo];
                    } else {
                        console.warn(`⚠️ Capítulo/versículo no hallado: ${nombreLibro} ${capitulo}:${versiculo}`);
                        return `[No encontrado: ${nombreLibro} ${capitulo}:${versiculo}]`;
                    }
                }
            }
            return null;
        }

        // ===== NAVEGACIÓN =====
        function cambiarPagina(pagina) {
            document.querySelectorAll('.pagina').forEach(p => p.classList.remove('activa'));
            document.getElementById('pagina' + pagina.charAt(0).toUpperCase() + pagina.slice(1)).classList.add('activa');
            document.querySelectorAll('.navbar button').forEach(b => b.classList.remove('activo'));
            document.getElementById('nav' + pagina.charAt(0).toUpperCase() + pagina.slice(1)).classList.add('activo');
            if (pagina === 'categorias') cargarCategorias();
            if (pagina === 'favoritos') cargarFavoritos();
        }

        // ===== MODO CLARO/OSCURO =====
        function toggleModo() {
            document.body.classList.toggle('modo-claro');
            const icono = document.querySelector('.modo-toggle');
            icono.textContent = document.body.classList.contains('modo-claro') ? '☀️' : '🌙';
        }

        // ===== CATEGORÍAS =====
        function cargarCategorias() {
            const container = document.getElementById('categoriasContainer');
            container.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'categoria-btn';
                btn.textContent = cat.nombre;
                btn.onclick = () => abrirModalCategoria(cat);
                container.appendChild(btn);
            });
        }

        let categoriaActualModal = null;

        function abrirModalCategoria(categoria) {
            categoriaActualModal = categoria;
            document.getElementById('modalCategoria').classList.add('activo');
            mostrarResultadoEnModal(categoria);
        }

        function cerrarModal() {
            document.getElementById('modalCategoria').classList.remove('activo');
        }

        function mostrarResultadoEnModal(categoria) {
            const ref = obtenerVersiculoUnico(categoria);
            const texto = obtenerTextoVersiculo(ref);
            const cita = `${ref.libro} ${ref.capitulo}:${ref.versiculo}`;
            const frase = categoria.fraseEmpatica[Math.floor(Math.random() * categoria.fraseEmpatica.length)];
            document.getElementById('categoriaNombreModal').textContent = categoria.nombre;
            document.getElementById('fraseEmpaticaModal').textContent = frase;
            document.getElementById('textoVersiculoModal').textContent = `“${texto}”`;
            document.getElementById('citaVersiculoModal').textContent = `— ${cita}`;
            versiculoActual = { texto, cita, categoria: categoria.nombre };
        }

        function nuevoVersiculoCategoria() {
            if (categoriaActualModal) mostrarResultadoEnModal(categoriaActualModal);
        }

        function guardarFavoritoDesdeModal() { guardarFavorito(); }
        function compartirDesdeModal() { compartirImagen(); }

        // ===== BÚSQUEDA PRINCIPAL =====
        let ultimosVersiculos = [];
        const MAX_HISTORIAL = 5;
        let versiculoActual = null;

        function obtenerVersiculoUnico(categoria) {
            const disponibles = categoria.referencias.filter(ref => {
                const clave = `${ref.libro}-${ref.capitulo}-${ref.versiculo}`;
                return !ultimosVersiculos.includes(clave);
            });
            if (disponibles.length === 0) {
                ultimosVersiculos = [];
                return obtenerVersiculoUnico(categoria);
            }
            const elegido = disponibles[Math.floor(Math.random() * disponibles.length)];
            const claveElegida = `${elegido.libro}-${elegido.capitulo}-${elegido.versiculo}`;
            ultimosVersiculos.push(claveElegida);
            if (ultimosVersiculos.length > MAX_HISTORIAL) ultimosVersiculos.shift();
            return elegido;
        }

        function buscarVersiculo() {
            const sentimiento = document.getElementById('inputSentimiento').value.trim();
            if (!sentimiento) return;
            const categoria = detectarCategoria(sentimiento);
            mostrarResultadoInicio(categoria);
        }

        function versiculoAleatorio() {
            const categoria = categories[Math.floor(Math.random() * categories.length)];
            document.getElementById('inputSentimiento').value = '';
            mostrarResultadoInicio(categoria);
        }

        function mostrarResultadoInicio(categoria) {
            const ref = obtenerVersiculoUnico(categoria);
            const texto = obtenerTextoVersiculo(ref);
            const cita = `${ref.libro} ${ref.capitulo}:${ref.versiculo}`;
            const frase = categoria.fraseEmpatica[Math.floor(Math.random() * categoria.fraseEmpatica.length)];
            document.getElementById('respuestaBox').style.display = 'block';
            document.getElementById('categoriaNombreInicio').textContent = categoria.nombre;
            document.getElementById('fraseEmpatica').textContent = frase;
            document.getElementById('textoVersiculo').textContent = `“${texto}”`;
            document.getElementById('citaVersiculo').textContent = `— ${cita}`;
            versiculoActual = { texto, cita, categoria: categoria.nombre };
        }

        // ===== LECTOR DE VERSÍCULOS =====
        function formatearCitaParaVoz(cita) {
            return cita.replace(/(\d+):(\d+)/, 'capítulo $1, versículo $2');
        }

        function speakText(text) {
            if (!window.speechSynthesis) {
                alert('Tu navegador no soporta lectura en voz alta.');
                return;
            }
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-MX';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }

        function speakVersiculo() {
            if (!versiculoActual) return;
            const citaLimpia = formatearCitaParaVoz(versiculoActual.cita);
            speakText(`${versiculoActual.texto}. ${citaLimpia}.`);
        }

        function speakVersiculoModal() {
            if (!versiculoActual) return;
            const citaLimpia = formatearCitaParaVoz(versiculoActual.cita);
            speakText(`${versiculoActual.texto}. ${citaLimpia}.`);
        }

        function speakFavorito(texto, cita) {
            const citaLimpia = formatearCitaParaVoz(cita);
            speakText(`${texto}. ${citaLimpia}.`);
        }

        // ===== FAVORITOS =====
        function guardarFavorito() {
            if (!versiculoActual) return;
            let favoritos = JSON.parse(localStorage.getItem('arcangelFavs') || '[]');
            const yaExiste = favoritos.some(f => f.texto === versiculoActual.texto && f.cita === versiculoActual.cita);
            if (!yaExiste) {
                favoritos.unshift(versiculoActual);
                localStorage.setItem('arcangelFavs', JSON.stringify(favoritos));
                alert('Versículo guardado en favoritos ⭐');
            } else {
                alert('Este versículo ya está en favoritos.');
            }
        }

        function cargarFavoritos() {
            const lista = document.getElementById('listaFavoritos');
            const noMsg = document.getElementById('noFavoritosMsg');
            let favoritos = JSON.parse(localStorage.getItem('arcangelFavs') || '[]');
            if (favoritos.length === 0) {
                lista.innerHTML = '';
                noMsg.style.display = 'block';
                return;
            }
            noMsg.style.display = 'none';
            lista.innerHTML = favoritos.map((fav, index) => `
                <div class="favorito-item">
                    <button class="eliminar-fav" onclick="eliminarFavorito(${index})">&times;</button>
                    <div class="categoria-nombre">${fav.categoria || ''}</div>
                    <div class="frase-empatica">${fav.frase || ''}</div>
                    <div class="versiculo-texto">“${fav.texto}”</div>
                    <div class="versiculo-cita">— ${fav.cita}</div>
                    <div class="acciones-versiculo">
                        <button onclick="speakFavorito('${fav.texto.replace(/'/g, "\\'")}', '${fav.cita.replace(/'/g, "\\'")}')"><span class="material-icons-outlined">volume_up</span> Escuchar</button>
                    </div>
                </div>
            `).join('');
        }

        function eliminarFavorito(index) {
            let favoritos = JSON.parse(localStorage.getItem('arcangelFavs') || '[]');
            favoritos.splice(index, 1);
            localStorage.setItem('arcangelFavs', JSON.stringify(favoritos));
            cargarFavoritos();
        }

        // ===== COMPARTIR IMAGEN =====
        function compartirImagen() {
            if (!versiculoActual) return;
            const canvas = document.getElementById('canvasCompartir');
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#fdfaf3';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 20;
            ctx.strokeRect(10, 10, canvas.width-20, canvas.height-20);
            ctx.fillStyle = '#3e2c1f';
            ctx.font = 'bold 30px "Cinzel", "Times New Roman", serif';
            ctx.textAlign = 'center';
            wrapText(ctx, `“${versiculoActual.texto}”`, canvas.width/2, 250, 600, 38);
            ctx.fillStyle = '#d4af37';
            ctx.font = '26px "Cinzel", serif';
            ctx.fillText(`— ${versiculoActual.cita}`, canvas.width/2, 480);
            ctx.fillStyle = '#5a4a3a';
            ctx.font = '20px Arial';
            ctx.fillText('Arcángel App', canvas.width/2, 650);
            canvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'versiculo-arcangel.png';
                a.click();
                URL.revokeObjectURL(url);
            });
        }

        function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            let testLine = '';
            let lineY = y;
            for (let n = 0; n < words.length; n++) {
                testLine = line + words[n] + ' ';
                const metrics = ctx.measureText(testLine);
                if (metrics.width > maxWidth && n > 0) {
                    ctx.fillText(line, x, lineY);
                    line = words[n] + ' ';
                    lineY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, x, lineY);
        }

        // ===== BOTÓN DE VOZ (DICTADO) =====
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let estaGrabando = false;
        window.addEventListener('DOMContentLoaded', () => {
            const botonHablar = document.getElementById('botonHablar');
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.lang = 'es-MX';
                recognition.interimResults = false;
                recognition.continuous = false;
                recognition.maxAlternatives = 1;
                recognition.onstart = () => {
                    estaGrabando = true;
                    botonHablar.style.background = 'rgba(200,50,50,0.7)';
                    botonHablar.innerHTML = '<span class="material-icons-outlined">mic</span> Escuchando...';
                };
                recognition.onresult = (event) => {
                    const texto = event.results[0][0].transcript.trim();
                    if (texto) {
                        document.getElementById('inputSentimiento').value = texto;
                        buscarVersiculo();
                    }
                };
                recognition.onerror = (event) => {
                    restaurarBoton();
                    if (event.error === 'not-allowed') alert('Permiso de micrófono denegado.');
                    else if (event.error === 'no-speech') alert('No se detectó voz.');
                };
                recognition.onend = restaurarBoton;
            } else {
                botonHablar.style.opacity = '0.5';
                botonHablar.title = 'Reconocimiento de voz no soportado';
                botonHablar.disabled = true;
            }
        });

        function iniciarDictado() {
            if (recognition && !estaGrabando) {
                try { recognition.start(); } catch(e) { restaurarBoton(); }
            }
        }
        function detenerDictado() {
            if (recognition && estaGrabando) {
                try { recognition.stop(); } catch(e) {}
            }
            restaurarBoton();
        }
        function restaurarBoton() {
            estaGrabando = false;
            const botonHablar = document.getElementById('botonHablar');
            if (botonHablar) {
                botonHablar.style.background = 'rgba(200,100,100,0.35)';
                botonHablar.innerHTML = '<span class="material-icons-outlined">mic</span> Háblame';
            }
        }
    </script>
</body>
</html>
