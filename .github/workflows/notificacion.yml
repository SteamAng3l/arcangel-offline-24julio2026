name: Notificaciones Automaticas Arcangel
on:
  schedule:
    # Se ejecuta todos los días a las 15:00 UTC (que son las 9:00 AM en México)
    - cron: '0 15 * * *'
  workflow_dispatch: # Esto te permite activarlo manualmente para probar HOY

jobs:
  enviar_notificacion:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3
      
      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Instalar Firebase Admin
        run: npm install firebase-admin
        
      - name: Ejecutar script de notificaciones
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node enviar_push.js
